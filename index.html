<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Card Design</title>
<style>
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  font-family: Arial, sans-serif;
}
.card {
  width: 340px;
  height: 210px;
  background: linear-gradient(135deg, #333, #050505, #222);
  border: 1px solid #777;
  border-radius: 14px;
  color: silver;
  padding: 22px;
  box-sizing: border-box;
  position: relative;
  box-shadow: 0 15px 40px #000;
}
.title {
  font-size: 19px;
  letter-spacing: 3px;
}
.sample {
  position: absolute;
  top: 90px;
  left: 90px;
  font-size: 35px;
  color: #ffffff55;
  transform: rotate(-25deg);
}
.name {
  position: absolute;
  bottom: 25px;
  letter-spacing: 2px;
}
</style>
</head>
<body>
<div class="card">
  <div class="title">CENTURION STYLE</div>
  <div class="sample">SAMPLE</div>
  <div class="name">CUSTOM CARD</div>
</div>
</body>
</html>
