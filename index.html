<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andria's Black Card</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.card {
  width: 440px;
  height: 275px;
  max-width: 94vw;
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  border: 2px solid #77756b;
  color: #d5c7b5;
  background:
    radial-gradient(ellipse at 85% 85%, #275c32 0%, transparent 48%),
    radial-gradient(ellipse at 25% 95%, #173b24 0%, transparent 45%),
    linear-gradient(135deg, #101310, #020302);
  box-shadow: 0 20px 55px #000;
}

.border {
  position: absolute;
  inset: 10px;
  border: 1px solid #77756b;
  border-radius: 12px;
}

.brand {
  position: absolute;
  top: 30px;
  width: 100%;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 3px;
}

.chip {
  position: absolute;
  top: 100px;
  left: 40px;
  width: 65px;
  height: 48px;
  border-radius: 9px;
  border: 2px solid #514b43;
  background:
    linear-gradient(90deg, transparent 45%, #514b43 46%, #514b43 49%, transparent 50%),
    linear-gradient(0deg, transparent 45%, #514b43 46%, #514b43 49%, transparent 50%),
    #c4b6a2;
}

.emblem {
  position: absolute;
  top: 85px;
  left: 175px;
  width: 95px;
  height: 115px;
  border: 3px double #c4b6a2;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
  color: #c4b6a2;
}

.leaves {
  position: absolute;
  right: 12px;
  bottom: 35px;
  font-size: 85px;
  opacity: 0.65;
  transform: rotate(-20deg);
}

.name {
  position: absolute;
  bottom: 25px;
  left: 35px;
  font-size: 18px;
  letter-spacing: 2px;
}

.sample {
  position: absolute;
  top: 205px;
  right: 30px;
  font-size: 12px;
  letter-spacing: 2px;
  color: #d5c7b5;
}

</style>
</head>

<body>

<div class="card">
  <div class="border"></div>
  <div class="brand">CENTURION INSPIRED</div>
  <div class="chip"></div>
  <div class="emblem">♞</div>
  <div class="leaves">🌿</div>
  <div class="name">ANDRIA CHKAREULI</div>
  <div class="sample">SAMPLE · NOT VALID</div>
</div>

</body>
</html>
